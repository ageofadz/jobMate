steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        if ! gcloud artifacts repositories describe "${_AR_REPOSITORY}" --location="${_REGION}" >/dev/null 2>&1; then
          gcloud artifacts repositories create "${_AR_REPOSITORY}" \
            --repository-format=docker \
            --location="${_REGION}"
        fi

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/web:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/web:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/web:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated

substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: jobmate
  _SERVICE_NAME: jobmate-web

options:
  logging: CLOUD_LOGGING_ONLY
