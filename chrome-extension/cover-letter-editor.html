<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JobMate — Cover letter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      background: #111827;
      color: #f9fafb;
    }
    header h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
    header p { margin: 0; font-size: 13px; color: #9ca3af; max-width: 720px; }
    main {
      flex: 1;
      padding: 20px 24px 24px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    textarea {
      width: 100%;
      min-height: 420px;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      resize: vertical;
      background: #fff;
    }
    textarea:focus { outline: 2px solid #059669; outline-offset: 1px; border-color: #059669; }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    button {
      font: 14px -apple-system, sans-serif;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    #save { background: #059669; color: #fff; }
    #save:hover { background: #047857; }
    #reject { background: #fff; color: #374151; border: 1px solid #d1d5db; }
    #reject:hover { background: #f9fafb; }
    #status { margin-top: 12px; font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <header>
    <h1>Review your cover letter</h1>
    <p>Edit the draft below. When you click Save, JobMate attaches it as a .txt file on the application form. Reject skips the cover letter upload entirely.</p>
  </header>
  <main>
    <textarea id="draft" spellcheck="true"></textarea>
    <div class="actions">
      <button type="button" id="save">Save and attach</button>
      <button type="button" id="reject">Reject — do not attach</button>
    </div>
    <p id="status"></p>
  </main>
  <script src="cover-letter-editor.js"></script>
</body>
</html>
